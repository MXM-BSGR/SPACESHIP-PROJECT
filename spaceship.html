<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPACESHIP</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="./spaceship.js"></script>
</head>

<body onload="renderStatus()">
    <div id="id_game_visualizer_hit" class="game_visualizer_hit"></div>
    <div id="id_game_over_msg" class="game_over_visualizer" onclick="restart()">
        <h1>GAME OVER</h1>
        <h3>click 2 restart</h3>

    </div>
    <main>
        <section id="id_status_section">
            <table id="table_wrapper">
                <tr>
                    <th id="table_header" colspan="2">Space Ship Info</th>
                </tr>
                <tr>
                    <th class="status_heading">Ship Name</th>
                    <td id="shipName">name</td>
                </tr>
                <tr>
                    <th class="status_heading">Ship HP</th>
                    <td id="shipHP">HP</td>
                </tr>
                <tr>
                    <th class="status_heading">Money</th>
                    <td id="playerMoney">dollar</td>
                </tr>
                <tr>
                    <th id="id_repair_kits_header" colspan="2">Repair Kits</th>

                </tr>
                <tr>
                    <th class="status_heading">Small</th>
                    <td id="smallRepaiKitAmount">amount</td>
                </tr>
                <tr>
                    <th class="status_heading">Large</th>
                    <td id="largeRepairKitAmount">amount</td>
                </tr>
                <tr>
                    <th id="id_status_msg_tabel_row" colspan="2">Status Msg</th>

                </tr>
                <tr>
                    <td id="id_status_msg_diplay" colspan="2">...</td>
                </tr>

            </table>
        </section>
        <section class="input_section">
            <div class="one_input_one_btn">
                <input id="input_add_damadge" type="number" placeholder="set your Attack Value">
                <button id="attack_execute_btn" type="button"
                    onclick="attackTriggeredBySubmitBtn(), renderHP(), showHit()">!
                    ATTACK
                    !</button>
            </div>

            <div class="one_input_two_btn">
                <button id="buy_small_repair_kit" type="button"
                    onclick=" buyRepairKitSmall(), renderStatus()">SMALL</button>
                <div id="buy_kit_qty">
                    <label for="input_kit_qty">Choose how much you want to BUY</label>
                    <input id="input_kit_qty" type="number">
                </div>
                <button id="buy_large_repair_kit" type="button"
                    onclick="buyRepairKitLarge(), renderStatus()">LARGE</button>
            </div>

            <div id="use_repair_Kits" class="pit_stop">
                <div id="pit_stop_text_area">
                    <h3>PIT STOP</h3>
                    <h4>Which Repair Kit you wanna USE</h4>
                </div>
                <div id="btn_wrapper">
                    <button type="button" onclick="useRepairKitSmall(),renderStatus()">SMALL</button>
                    <button type="button" onclick="useRepairKitLarge(),renderStatus()">LARGE</button>
                </div>
            </div>
        </section>




    </main>

</body>

</html>
