<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPACESHIP</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="./spaceship.js"></script>
</head>

<body onload="renderStatus()">
    <div id="id_game_visualizer_hit" class="game_visualizer_hit"></div>
    <div id="id_game_over_msg" class="game_over_visualizer" onclick="restart()">
        <h1>GAME OVER</h1>
        <h3>click 2 restart</h3>

    </div>
    <main>
        <section id="id_status_section">
            <table id="table_wrapper">
                <tr>
                    <th id="table_header" colspan="2">Space Ship Info</th>
                </tr>
                <tr>
                    <th class="status_heading">Ship Name</th>
                    <td id="shipName">name</td>
                </tr>
                <tr>
                    <th class="status_heading">Ship HP</th>
                    <td id="shipHP">HP</td>
                </tr>
                <tr>
                    <th class="status_heading">Money</th>
                    <td id="playerMoney">dollar</td>
                </tr>
                <tr>
                    <th id="id_repair_kits_header" colspan="2">Repair Kits</th>

                </tr>
                <tr>
                    <th class="status_heading">Small</th>
                    <td id="smallRepaiKitAmount">amount</td>
                </tr>
                <tr>
                    <th class="status_heading">Large</th>
                    <td id="largeRepairKitAmount">amount</td>
                </tr>
            </table>
        </section>
        <section class="input_section">
            <div class="one_input_one_btn">
                <input id="input_add_damadge" type="number" placeholder="set your Attack Value">
                <button id="attack_execute_btn" type="button"
                    onclick="attackTriggeredBySubmitBtn(), renderHP(), showHit()">!
                    ATTACK
                    !</button>
            </div>

            <div class="one_input_two_btn">
                <button id="buy_small_repair_kit" type="button" onclick="">SMALL</button>
                <div id="buy_kit_qty">
                    <label for="kit_qty">Choose how much you want to BUY</label>
                    <input id="kit_qty" type="number">
                </div>
                <button id="buy_large_repair_kit" type="button" onclick="">LARGE</button>
            </div>
        </section>




    </main>

</body>

</html>
