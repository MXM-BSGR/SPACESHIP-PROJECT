<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPACESHIP</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="cockpit.css">

    <script defer src="./spaceship.js"></script>
</head>

<body onload="renderStatus()">
    <div id="id_game_visualizer_hit" class="game_visualizer_hit"></div>
    <div id="id_game_over_msg" class="game_over_visualizer" onclick="restart()">
        <h1>GAME OVER</h1>
        <h3>click 2 restart</h3>

    </div>
    <main>
        <!-- <section class="msg_section">
            <div class="msg_wrapper">
                <tr>
                    <th id="id_status_msg_tabel_row" colspan="2">Status Msg</th>

                </tr>
                <p id="id_status_msg_diplay" colspan="2">...</p>

            </div>
        </section> -->
        <section id="id_status_section">
            <div class="display_darkener">
                <table id="status_table_wrapper">
                    <!-- <tr>
                    <th id="table_header" colspan="2">Space Ship Info</th>
                </tr> -->
                    <tr>
                        <!-- <th class="status_heading">Ship Name</th> -->
                        <td id="playerMoney">dollar</td>
                        <!-- </tr>
                <tr> -->
                        <!-- <th class="status_heading">Ship HP</th> -->
                        <td id="shipName">name</td>
                        <!-- </tr>
                <tr> -->
                        <!-- <th class="status_heading">Money</th> -->
                        <td id="shipHP">HP</td>
                    </tr>
                </table>
                <table id="repair_kit_table_wrapper">
                    <tr>
                        <th id="id_repair_kits_header">Repair Kits:</th>

                        <!-- </tr>
                <tr> -->
                        <th class="status_heading">Small</th>
                        <td id="smallRepaiKitAmount">amount</td>
                        <!-- </tr>
                <tr> -->
                        <th class="status_heading">Large</th>
                        <td id="largeRepairKitAmount">amount</td>
                    </tr>
                </table>
                <!-- <tr>
                    <th id="id_status_msg_tabel_row" colspan="2">Status Msg</th>
                </tr>
                <tr>
                    <td id="id_status_msg_diplay" colspan="2">...</td>
                </tr> -->

                <div class="msg_wrapper">

                    <p id="id_status_msg_diplay" colspan="2"> ..: ...:... ...:... ...:... :.. </p>

                </div>
            </div>



        </section>

        <section class="inventory_ship">
            <button id="id_open_inventory" class="inventory_opener_btn btn"
                onclick="showInventoryDisplay()">Show<br>Inventory</button>
            <button id="id_buy_shield_btn" class="buy_shield_btn btn" onclick="buyShield()">BUY<br>SHIELD</button>

            <div class="perspective_left">
                <div id="id_inventory_display" class="inventory_display">
                    <h3>..:.|Inventory|.:..</h3>
                    <ul id="id_inventory_ship_list">


                    </ul>
                </div>
            </div>


        </section>
        <section class="input_section">
            <div class="one_input_one_btn">
                <input id="input_add_damadge" type="number" placeholder="set here Attack Value">

                <button id="attack_execute_btn btn" class="attack_execute_btn btn" type="button"
                    onclick="attackTriggeredByBtn(), renderHP(), showHit()">!
                    ATTACK
                    !</button>
            </div>

            <div class="one_input_two_btn">
                <input id="input_kit_qty" type="number" placeholder="type in qty here!!!">

                <!-- <label for="input_kit_qty">Choose how much you want to BUY</label> -->
                <div class="choose_size">
                    <button id="buy_large_repair_kit" class="buy_repair_kit_large_btn btn" type="button"
                        onclick="buyRepairKitLarge(), renderStatus()">
                        BUY LARGE</button>
                    <button id="buy_small_repair_kit" class="buy_repair_kit_small_btn btn" type="button"
                        onclick=" buyRepairKitSmall(), renderStatus()"> BUY
                        SMALL</button>
                </div>
            </div>



            <div id="btn_wrapper">
                <button class="use_repair_kit_small_btn btn" type="button" onclick="useRepairKitSmall(),renderStatus()">
                    !USE!<br> SMALL KIT</button>
                <button class="use_repair_kit_large_btn btn" type="button" onclick="useRepairKitLarge(),renderStatus()">
                    !USE!<br> LARGE KIT</button>

            </div>
        </section>




    </main>

</body>

</html>
